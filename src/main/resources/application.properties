spring.application.name=locationlens

# Debugging
logging.level.org.springframework.security=TRACE

spring.security.oauth2.client.provider.keycloak.issuer-uri=${IDP_URI}
spring.security.oauth2.client.registration.common-idp.provider=keycloak
spring.security.oauth2.client.registration.common-idp.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.common-idp.client-id=${IDP_CLIENT_ID}
spring.security.oauth2.client.registration.common-idp.client-secret=${IDP_CLIENT_SECRET}
# "profile" and "email" are requested (in addition to the mandatory
# "openid" scope) so that the ID token / access token returned by the
# IDP actually contains given_name, family_name and email claims. With
# only "openid" requested, the IDP is not obligated to include them.
spring.security.oauth2.client.registration.common-idp.scope=openid,profile,email

# Resource-server configuration: this app also validates bearer access
# tokens presented to /api/v1/** endpoints. Spring Boot auto-configures
# a JwtDecoder by fetching {issuer-uri}/.well-known/openid-configuration
# and, from there, the IDP's JWKS (public signing keys). Because the
# same Keycloak realm both issues and is trusted to validate tokens,
# this reuses the same IDP_URI environment variable as the client
# registration above - no separate secret is needed on this side.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${IDP_URI}

# Comma-separated allow-list of URIs that GET /api/v1/login is
# permitted to redirect to, via its optional ?target= query
# parameter, once login succeeds (see AuthController and
# IdpTokenRelaySuccessHandler). Each entry must match a requested
# ?target= value exactly - character for character, including any
# trailing slash or path segment - since this list is what stops
# /api/v1/login from being an open redirect. Leave empty (the
# default) to disable ?target= entirely; every login then falls back
# to returning the token as a plain JSON body.
net.bp4k.locationlens.redirect-uri=${VALID_REDIRECTS}
